# ==============================================================================
# ha-rhel-cluster/monitoring/prometheus/prometheus.yml
# High-Resolution 1-Second Prometheus Configuration for Cluster Failover Tracking
# ==============================================================================

global:
  scrape_interval:     1s      # 1-second resolution for sub-2s failover capture
  evaluation_interval: 1s
  scrape_timeout:      1s

rule_files:
  - "/etc/prometheus/alert.rules.yml"

scrape_configs:
  # ----------------------------------------------------------------------------
  # 1. Keepalived VRRP State & VIP Ownership
  # ----------------------------------------------------------------------------
  - job_name: "keepalived"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "192.168.56.11:9650"
        labels:
          node: "lb1"
          role: "load_balancer"
      - targets:
          - "192.168.56.12:9650"
        labels:
          node: "lb2"
          role: "load_balancer"

  # ----------------------------------------------------------------------------
  # 2. HAProxy Ingress Metrics & Backend Pool Health
  # ----------------------------------------------------------------------------
  - job_name: "haproxy"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "192.168.56.11:8404"
        labels:
          node: "lb1"
      - targets:
          - "192.168.56.12:8404"
        labels:
          node: "lb2"

  # ----------------------------------------------------------------------------
  # 3. Microservice API Replicas on app1
  # ----------------------------------------------------------------------------
  - job_name: "app_api"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "192.168.56.20:8081"
        labels:
          replica: "api-replica-1"
          host: "app1"
      - targets:
          - "192.168.56.20:8082"
        labels:
          replica: "api-replica-2"
          host: "app1"

  # ----------------------------------------------------------------------------
  # 4. Host Node Exporters (lb1, lb2, app1, mon1)
  # ----------------------------------------------------------------------------
  - job_name: "node_exporter"
    static_configs:
      - targets:
          - "192.168.56.11:9100"
        labels:
          instance_node: "lb1"
      - targets:
          - "192.168.56.12:9100"
        labels:
          instance_node: "lb2"
      - targets:
          - "192.168.56.20:9100"
        labels:
          instance_node: "app1"
      - targets:
          - "192.168.56.30:9100"
        labels:
          instance_node: "mon1"

  # ----------------------------------------------------------------------------
  # 5. Prometheus Internal Metrics
  # ----------------------------------------------------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
