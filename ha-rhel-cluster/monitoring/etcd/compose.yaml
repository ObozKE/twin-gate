# ==============================================================================
# ha-rhel-cluster/monitoring/etcd/compose.yaml
# Lightweight etcd v3.5 Consensus Member for Patroni Distributed Lock Management
# ==============================================================================

version: "3.8"

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.13
    container_name: etcd-member
    restart: always
    network_mode: host
    environment:
      ETCD_NAME: ${ETCD_NODE_NAME:-etcd1}
      ETCD_DATA_DIR: /var/lib/etcd/data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://${NODE_IP}:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://${NODE_IP}:2380
      ETCD_INITIAL_CLUSTER: etcd1=http://192.168.56.20:2380,etcd2=http://192.168.56.21:2380,etcd3=http://192.168.56.30:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: patroni-etcd-cluster
    volumes:
      - /var/lib/etcd/data:/var/lib/etcd/data:Z
